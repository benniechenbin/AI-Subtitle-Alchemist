version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
      - dependency-name: "sentence-transformers"

    groups:
      python-dev-tools:
        patterns:
          - "mypy"
          - "ruff"
          - "pre-commit"
          - "pytest"
          - "pytest-cov"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
