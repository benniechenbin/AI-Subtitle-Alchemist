repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-merge-conflict
        args:
        - --assume-in-merge
    -   id: check-added-large-files
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-ast
    -   id: debug-statements
    -   id: detect-private-key
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
-   repo: local
    hooks:
    -   id: generate-env-example
        name: Check .env.example against Settings
        entry: uv run --locked python scripts/generate_env_example.py
        language: system
        always_run: true
        pass_filenames: false
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or:
        - python
        - pyi
    -   id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or:
        - python
        - pyi
        - jupyter
-   repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
    -   id: markdownlint-cli2
        args:
        - --fix
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: mixed-line-ending
        args:
        - --fix=lf
    -   id: trailing-whitespace
        args:
        - --markdown-linebreak-ext=md
    -   id: end-of-file-fixer
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.pyi?)$
