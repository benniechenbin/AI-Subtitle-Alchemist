# .markdownlint-cli2.yaml

gitignore: true

config:
  # -------------------------------------------------------------
  # 默认关闭，只显式启用高价值、低误报规则
  # -------------------------------------------------------------
  default: false

  # -------------------------------------------------------------
  # Headings — 标题结构
  # -------------------------------------------------------------

  # 标题层级必须逐级递增
  # 禁止从 # 直接跳到 ###
  MD001: true

  # 标题统一使用 ATX 风格：# / ## / ###
  MD003:
    style: atx

  # ATX 标题标记后必须有空格
  # 禁止：#Title
  MD018: true

  # ATX 标题标记后只能使用规范空格
  # 禁止：#  Title
  MD019: true

  # 标题前后各保留一个空行
  MD022:
    lines_above: 1
    lines_below: 1

  # 标题必须从行首开始
  MD023: true

  # -------------------------------------------------------------
  # Lists — 列表
  # -------------------------------------------------------------

  # 无序列表统一使用 -
  MD004:
    style: dash

  # 同级列表缩进保持一致
  MD005: true

  # 嵌套无序列表使用两个空格缩进
  MD007:
    indent: 2

  # 列表标记后统一一个空格
  MD030:
    ul_single: 1
    ul_multi: 1
    ol_single: 1
    ol_multi: 1

  # 列表前后保留空行
  MD032: true

  # -------------------------------------------------------------
  # Whitespace / Inline Syntax — Markdown 内部格式
  # -------------------------------------------------------------

  # Markdown 正文禁止 Tab
  # 代码块不检查，避免影响 Makefile / 示例代码等
  MD010:
    code_blocks: false
    spaces_per_tab: 2

  # 最多允许一个连续空行
  MD012:
    maximum: 1

  # emphasis 内部不允许多余空格
  # 禁止：** text **
  MD037: true

  # inline code 内部不允许不必要的空格
  # 禁止：` code `
  MD038: true

  # 链接文本内部不允许多余空格
  # 禁止：[ text ](url)
  MD039: true

  # -------------------------------------------------------------
  # Code Blocks — 代码块
  # -------------------------------------------------------------

  # fenced code block 前后必须有空行
  MD031: true

  # fenced code block 必须指定语言
  # 普通文本 / ASCII 图使用 ```text
  MD040: true

  # 统一使用 fenced code block
  MD046:
    style: fenced

  # fenced code block 统一使用 ```
  # 不使用 ~~~
  MD048:
    style: backtick

  # -------------------------------------------------------------
  # Links / Images — 链接与图片
  # -------------------------------------------------------------

  # 禁止空链接
  # 例如：[文档]()
  MD042: true

  # 图片必须提供 alt text
  # 推荐：![架构图](architecture.png)
  MD045: true
