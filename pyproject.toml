[project]
name = "ai-subtitle-alchemist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "chardet>=7.4.3",
    "guessit>=3.8.0",
    "loguru>=0.7.3",
    "numpy>=2.4.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy<2.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "sentence-transformers>=3.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers<4.42.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sqlite-vec>=0.1.6,<0.2",
    "streamlit>=1.60.0",
    "torchvision>=0.27.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.pyright]
extraPaths = ["."]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["manual: manual tests requiring API keys or network"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
